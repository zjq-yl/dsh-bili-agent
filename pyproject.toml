[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-bili-agent-core"
version = "0.1.0.dev1"
description = "Python business core for the DSH Bilibili agent plugin"
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bili_agent = ["prompts/*.md"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/base.txt"]}
optional-dependencies.audio = {file = ["requirements/audio.txt"]}
optional-dependencies.browser = {file = ["requirements/browser.txt"]}
optional-dependencies.dev = {file = ["requirements/dev.txt"]}

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["legacy", ".design-revision", ".desktop-test", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/__init__.py" = ["E402"]
"scripts/check-runtime.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
